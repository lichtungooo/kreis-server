# kreis-server — LiveKit und Token-Dienst fuer das Kreis-Modul im RLN.
#
# Zwei Dienste:
#   livekit  — der SFU. Leitet Audio, Video und Daten weiter.
#   token    — signiert kurzlebige Zutritts-Token. Haelt das Geheimnis
#              vom Browser fern (siehe memory/feedback_sperre_pruefbares.md).
#
# Konfiguration in .env, Vorlage in .env.beispiel.
# Start:  docker compose up -d

services:

  livekit:
    image: livekit/livekit-server:v1.8
    container_name: kreis-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    network_mode: bridge
    # ⚠ Warum Bridge statt Host, gegen die uebliche Empfehlung:
    #
    # Im Host-Netz hat der Container keine Adresse im Docker-Netz, und
    # Traefiks Docker-Provider verlangt genau die. Er weist eine
    # vollstaendige Adresse ab: `service error: port is missing`.
    #
    # Ein nginx davor half auch nicht: auf diesem Server darf kein
    # Container den Host erreichen, weder ueber die Bruecke 172.17.0.1
    # noch ueber die oeffentliche Adresse. Beides laeuft in einen Timeout.
    #
    # Mit 1:1-Abbildung der Ports und festem `node_ip` in livekit.yaml
    # traegt das Bridge-Netz: LiveKit nennt jedem Teilnehmer die richtige
    # oeffentliche Adresse, und die Pakete finden ihren Weg.
    ports:
      - "7881:7881"          # Signaling, geht durch Traefik
      - "7882:7882/udp"      # Medien
      - "7883:7883"          # Medien, wenn UDP blockiert ist
      - "3478:3478/udp"      # TURN
      - "5349:5349"          # TURN ueber TLS
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY fehlt}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET fehlt}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kreis-livekit.rule=Host(`kreis.wir.ooo`)"
      - "traefik.http.routers.kreis-livekit.entrypoints=websecure"
      - "traefik.http.routers.kreis-livekit.tls.certresolver=letsencrypt"
      # Niedrige Zahl: der Token-Weg wird zuerst geprueft.
      - "traefik.http.routers.kreis-livekit.priority=1"
      - "traefik.http.services.kreis-livekit.loadbalancer.server.port=7881"
      - "com.centurylinklabs.watchtower.enable=false"

  token:
    build: ./token
    container_name: kreis-token
    restart: unless-stopped
    network_mode: bridge
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY fehlt}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET fehlt}"
      # Wer darf Token holen. Komma-getrennt, ohne Leerzeichen.
      ERLAUBTE_HERKUNFT: "${ERLAUBTE_HERKUNFT:-https://reallife.network,http://localhost:5173}"
      PORT: "7880"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kreis-token.rule=Host(`kreis.wir.ooo`) && PathPrefix(`/token`)"
      - "traefik.http.routers.kreis-token.entrypoints=websecure"
      - "traefik.http.routers.kreis-token.tls.certresolver=letsencrypt"
      # Hoehere Zahl gewinnt. Der Token-Weg liegt innerhalb des LiveKit-
      # Wegs, darum muss er zuerst geprueft werden.
      - "traefik.http.routers.kreis-token.priority=10"
      - "traefik.http.services.kreis-token.loadbalancer.server.port=7880"
      - "com.centurylinklabs.watchtower.enable=false"
