# Weiterleiter vom Docker-Netz zum LiveKit im Host-Netz.
#
# ⚠ Warum es diesen Umweg gibt: LiveKit laeuft im Host-Netz, weil WebRTC
# viele UDP-Ports braucht und NAT dazwischen die Verbindung still zerlegt.
# Ein Container im Host-Netz hat aber keine Adresse im Docker-Netz, und
# Traefiks Docker-Provider findet ihn darum nicht. Er verlangt einen Port
# an einer Container-IP und weist eine vollstaendige Adresse ab:
#
#     service "kreis-livekit" error: port is missing
#
# Dieser nginx sitzt im Docker-Netz, traegt die Traefik-Labels und reicht
# alles an den Host weiter. Nur das Signaling laeuft hier durch, die
# Medien gehen weiterhin direkt an den Host.

upstream livekit {
    server 172.17.0.1:7881;
}

server {
    listen 80;
    server_name _;

    # LiveKit spricht WebSocket. Ohne diese drei Zeilen bleibt die
    # Verbindung bei HTTP stehen und der Raum oeffnet sich nie.
    location / {
        proxy_pass http://livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ein Kreis dauert laenger als eine Minute. Ohne diese Werte
        # faellt die Verbindung nach dem Standard-Zeitlimit.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
